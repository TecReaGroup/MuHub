  <path d="M150 170 H200" class="edge" stroke-width="1.25" />
  <path d="M340 170 H400" class="edge" stroke-width="1.25" />
  <path d="M540 150 L600 115" class="edge" stroke-width="1.25" />
  <path d="M540 190 L600 225" class="edge" stroke-width="1.25" />
  <path d="M470 215 V255" class="edge-soft" stroke-width="1.25" stroke-dasharray="3 3" />

  <rect x="40" y="135" width="110" height="70" rx="12" class="node" stroke-width="1.25" />
  <text x="95" y="167" text-anchor="middle" class="title">Browser</text>
