    .zone { stroke: #d4d4d8; }
    .zone-label { fill: #a1a1aa; font-size: 10px; letter-spacing: 2px; }
  </style>

  <rect x="365" y="40" width="400" height="260" rx="20" class="zone" stroke-dasharray="4 4" />
