services:
  muhub:
    image: muhub
    container_name: muhub
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Overrides the image's `USER node` so bind mounts created by Docker as root stay writable.
    user: "root"
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data/log:/app/backend/data/log
      - ./backend/data/store:/app/backend/data/store
    environment:
      NODE_ENV: production
      TZ: Asia/Singapore
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
