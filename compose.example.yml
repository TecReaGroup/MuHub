services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data/log:/app/backend/data/log
      - ./backend/data/store:/app/backend/data/store
    environment:
      NODE_ENV: production
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
